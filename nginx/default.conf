# nginx перед news-service: наружу открыт только он (порт 8080 на хосте → 80 здесь),
# а сам сервис доступен лишь внутри docker-сети по имени news-app.

upstream news_app {
    server news-app:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    server_tokens off;

    gzip on;
    gzip_types application/json application/yaml text/css application/javascript;
    gzip_min_length 1024;

    # Все общие настройки проксирования
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;

    # Лента и отдельные новости
    location /api/news {
        proxy_pass http://news_app;
    }

    # Swagger UI; можно не открывать в проде
    location /api/docs {
        proxy_pass http://news_app;
    }

    location = /health {
        proxy_pass http://news_app;
        access_log off;
    }

    location / {
        return 404;
    }
}
